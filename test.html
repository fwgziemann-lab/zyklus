<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
  <meta name="robots" content="noindex">
  <title>Zyklus – Tests</title>
  <style>
    :root { color-scheme: light dark; }
    body { font-family: -apple-system, system-ui, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 1.5rem; max-width: 60rem; background: #fafafa; color: #222; }
    @media (prefers-color-scheme: dark) { body { background: #121212; color: #eee; } }
    h1 { font-size: 1.4rem; }
    #summary { font-weight: 600; padding: .75rem 1rem; border-radius: .5rem; margin: 1rem 0; }
    #summary.ok { background: #1b7f3a22; color: #1b7f3a; }
    #summary.fail { background: #c0392b22; color: #c0392b; }
    ul { list-style: none; padding: 0; }
    li { padding: .4rem .5rem; border-bottom: 1px solid #8884; }
    li.ok::before { content: "✓ "; color: #1b7f3a; }
    li.fail::before { content: "✗ "; color: #c0392b; }
    li .msg { display: block; color: #c0392b; font-family: ui-monospace, Menlo, monospace; font-size: .85rem; margin-top: .25rem; white-space: pre-wrap; }
    a { color: inherit; }
  </style>
</head>
<body>
  <h1>Zyklus – Tests der Berechnung</h1>
  <p>Prüft <code>core.js</code> (Datumsrechnung, Periodenerkennung, Vorhersage, Statistik, Abbildung auf Google-Termine) und <code>crypto.js</code> (Verschlüsselung). <a href="./">Zurück zur App</a></p>
  <div id="summary">Tests laufen …</div>
  <ul id="results"></ul>
  <script src="core.js"></script>
  <script src="crypto.js"></script>
  <script src="tests.js"></script>
  <script src="test-runner.js"></script>
</body>
</html>
